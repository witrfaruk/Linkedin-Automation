name: LinkedIn Auto Poster Cron

on:
  schedule:
    - cron: '50 8 * * *'  # 4:50 AM ET (EDT = UTC-4)
    - cron: '59 16 * * *' # 12:59 PM ET
    - cron: '45 20 * * *' # 4:45 PM ET
    - cron: '45 23 * * *' # 7:45 PM ET
    - cron: '7 1 * * *'   # 9:07 PM ET
  workflow_dispatch: # Allows manual triggering from the GitHub UI if needed

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Automation Script
        run: npx tsx scripts/cron.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
