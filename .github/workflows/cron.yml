name: LinkedIn Auto Poster Cron

on:
  schedule:
    - cron: '0 12 * * *' # 8:00 AM ET (EDT = UTC-4)
    - cron: '0 14 * * *' # 10:00 AM ET
    - cron: '0 16 * * *' # 12:00 PM ET
    - cron: '0 18 * * *' # 2:00 PM ET
    - cron: '0 21 * * *' # 5:00 PM ET
  workflow_dispatch: # Allows manual triggering from the GitHub UI if needed

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Automation Script
        run: npx tsx scripts/cron.ts
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
