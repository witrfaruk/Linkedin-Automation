name: LinkedIn Auto Poster Cron

on:
  schedule:
    - cron: '50 8 * * *'  # 4:50 AM ET (EDT = UTC-4)
    - cron: '59 16 * * *' # 12:59 PM ET
    - cron: '45 20 * * *' # 4:45 PM ET
    - cron: '45 23 * * *' # 7:45 PM ET
    - cron: '7 1 * * *'   # 9:07 PM ET
  workflow_dispatch: # Allows manual triggering from the GitHub UI if needed

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Automation Script
        run: npx tsx scripts/cron.ts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL || vars.ANTHROPIC_MODEL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SEARCH_QUERY: ${{ secrets.SEARCH_QUERY || vars.SEARCH_QUERY }}
          INCLUDE_DOMAINS: ${{ secrets.INCLUDE_DOMAINS || vars.INCLUDE_DOMAINS }}
          EXCLUDE_DOMAINS: ${{ secrets.EXCLUDE_DOMAINS || vars.EXCLUDE_DOMAINS }}
          SEARCH_DAYS: ${{ secrets.SEARCH_DAYS || vars.SEARCH_DAYS }}
          SEARCH_MAX_RESULTS: ${{ secrets.SEARCH_MAX_RESULTS || vars.SEARCH_MAX_RESULTS }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
